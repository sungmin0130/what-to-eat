<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오늘 뭐 먹지?</title>
  <meta name="description" content="내 주변 음식점 메뉴로 돌림판을 돌려 오늘 메뉴를 정해요">
  <meta name="theme-color" content="#f7f5f1">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/index.css">
</head>
<body>
  <main class="app">

    <!-- 1. 시작 화면 -->
    <section id="screen-start" class="screen">
      <header class="hero">
        <p class="eyebrow">Today's Menu</p>
        <h1>오늘 뭐 먹지?</h1>
        <p class="lead">내 주변 음식점의 메뉴로 돌림판을 돌려 정해요</p>
      </header>

      <div class="card">
        <p class="label">검색 거리</p>
        <p class="radius-label" id="radius-label" aria-live="polite">500m · 걸어서 약 6분</p>
        <input id="radius-slider" type="range" min="100" max="3000" step="100" value="500"
               aria-label="검색 거리">
        <div class="slider-ends"><span>100m</span><span>3km</span></div>
        <div class="quick" id="quick-start" role="group" aria-label="빠른 거리 고르기"></div>
      </div>

      <button id="locate-btn" class="primary big" type="button">내 주변에서 찾기</button>
      <p class="status" id="start-status" role="status"></p>

      <form id="address-form" class="card address">
        <label for="address-input" class="label">또는 주소로 찾기</label>
        <div class="row">
          <input id="address-input" name="query" maxlength="50" placeholder="예: 역삼동, 서울역" required>
          <button type="submit" class="secondary">찾기</button>
        </div>
      </form>

      <div id="recent-box" class="card hidden">
        <p class="label">최근 결과</p>
        <ul id="recent-list" class="recent"></ul>
      </div>
    </section>

    <!-- 2. 메뉴 고르기 화면 -->
    <section id="screen-menus" class="screen hidden">
      <div class="topline">
        <button id="back-start" class="ghost" type="button">← 처음으로</button>
      </div>
      <div class="card summary">
        <p class="label">현재 위치</p>
        <p class="where" id="where">내 위치</p>
        <p class="sub" id="summary-line"></p>
        <div class="quick" id="quick-menus" role="group" aria-label="거리 바꿔 다시 찾기"></div>
      </div>

      <p class="status" id="menus-status" role="status"></p>

      <div id="menus-body">
        <div class="kinds" id="kinds" role="group" aria-label="종류로 거르기"></div>
        <p class="note hidden" id="limited-note">음식점이 아주 많아서 일부만 골고루 골라 보여요</p>

        <ul id="menu-list" class="menu-list"></ul>

        <form id="custom-form" class="row custom">
          <input id="custom-input" maxlength="15" placeholder="메뉴 직접 넣기 (1~15자)" aria-label="직접 넣을 메뉴">
          <button type="submit" class="secondary">추가</button>
        </form>
        <p class="form-error" id="custom-error" role="alert"></p>

        <button id="make-wheel" class="primary big" type="button">돌림판 만들기</button>
      </div>
    </section>

    <!-- 3. 돌림판 화면 -->
    <section id="screen-wheel" class="screen hidden">
      <div class="topline">
        <button id="back-menus" class="ghost" type="button">← 메뉴 다시 고르기</button>
      </div>
      <p class="note hidden" id="overflow-note"></p>
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="900" height="900" aria-label="메뉴 돌림판"></canvas>
      </div>
      <button id="spin-btn" class="primary big" type="button">돌리기</button>
    </section>
  </main>

  <!-- 4. 결과 창 -->
  <div id="result" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="modal-box">
      <p class="eyebrow">오늘의 메뉴</p>
      <h2 id="result-title"><span id="result-menu"></span></h2>
      <p class="label">근처에서 파는 곳</p>
      <ul id="result-places" class="places"></ul>
      <label class="check">
        <input type="checkbox" id="exclude-last"> 방금 나온 메뉴 빼고 돌리기
      </label>
      <div class="row buttons">
        <button id="again-btn" class="primary" type="button">다시 돌리기</button>
        <button id="reselect-btn" class="secondary" type="button">메뉴 다시 고르기</button>
      </div>
      <button id="share-btn" class="ghost" type="button">친구에게 공유하기</button>
      <p class="status" id="share-status" role="status"></p>
    </div>
  </div>

  <script src="/static/index.js"></script>
</body>
</html>
